<!DOCTYPE html>
<html lang="en-US">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Front page of the Down The River rafting company website, a white water rafting company that offers rafting trips on wild rivers.">
        <meta name="author" content="Vegard André Amundsen">
        <title>Front page - Down The River rafting</title>
        <link rel="stylesheet" href="styles/rafting.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    </head>
    <body>
        <header>
            <a href="index.html"><img src="images/logo-downriver.webp" alt="Down The River logo"></a>
            <nav>
                <ul class="navigation">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About us</a></li>
                    <li><a href="trips.html">Our trips</a></li>
                    <li><a href="contact.html">Contact us</a></li>                    
                </ul>
            </nav>
        </header>
        <main>
            <div class="hero frontpage">
                <img src="images/hero_transparency_1024.webp" alt="rafting group">
                <h1>Experience Down The River rafting</h1>
                <button onclick="window.location.href='trips.html'">Book your experience now!</button>
            </div>
            <section class="offerings">
                <h2>Explore our amazing offers</h2>
                <a href="trips.html"><img class="oi1" src="images/rafting04_600.webp" alt="White water rafting">
                <p class="o1">Rafting</p></a>
                <a href="trips.html"><img class="oi2" src="images/rafting05_600.webp" alt="Team of rafters">
                <p class="o2">Team-bulding</p></a>
                <a href="trips.html"><img class="oi3" src="images/meals_600.webp" alt="meal being shared">
                <p class="o3">Meal deals</p></a>
            </section>
            <form>
                <fieldset>
                    <legend>Sign up for our newsletter!</legend>
                    <label for="fullname">Full name</label>
                    <input type="text" id="fullname" name="fullname">
                    <label for="email">E-mail</label>
                    <input type="text" id="email" name="email">
                </fieldset>
                <button type="submit">Sign up for the newsletter</button>
            </form>       
       </main>
        <footer>
            <p>&copy; 2025, Down The River, Vegard André Amundsen.</p>
            <nav class="socialmedia">
                <a href="https://www.x.com">
                    <img src="images/x.webp" alt="X social media logo">
                </a>
                <a href="https://www.instagram.com">
                    <img src="images/instagram.webp" alt="Instagram social media logo">
                </a>
                <a href="https://www.facebook.com">
                    <img src="images/facebook.webp" alt="Facebook social media logo">
                </a>
            </nav>
        </footer>
    </body>
</html>
